name: 'draft-cli-action'

description: ''

branding:
  icon: terminal
  color: blue

inputs:
  version:
    description: 'version to install cli'
    default: 'latest'
    required: false
  access_token:
    description: 'GitHub access token'
    required: false

runs:
  using: composite
  steps:
    - name: 'Set version'
      shell: bash
      id: version
      run: |
        if [[ "${{ inputs.version }}" == "latest" ]]; then
          version=$(gh release view --repo Drafteame/draft --json tagName -q .tagName)
        else
          version="${{ inputs.version }}"
        fi

        # remove v prefix
        version=${version#v}

        echo "version=$version" >> $GITHUB_OUTPUT

    - name: 'Install draft-cli'
      shell: bash
      run: |
        echo "${{ inputs.access_token }}" | gh auth login --with-token

        gh release download v${{ steps.version.outputs.version }} \
          --repo Drafteame/draft \
          --pattern "*linux_amd64*"

        # untar the downloaded file
        tar -xzf draft_linux_amd64_${{ steps.version.outputs.version }}.tar.gz

        # move the binary to /usr/local/bin
        sudo mv draft /usr/local/bin/draft
